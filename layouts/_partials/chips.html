{{- /* Filter tag: link biasa ke halaman tag (jalan tanpa JS). Konteks: halaman saat ini. */ -}}
<nav class="chips" aria-label="{{ i18n "tags_title" }}">
  {{- with site.GetPage "/tulisan" }}<a class="chip" href="{{ .RelPermalink }}"{{ if or $.IsHome (eq $.Kind "section") }} aria-current="page"{{ end }}>{{ i18n "all" }}</a>{{ end }}
  {{- range site.Taxonomies.tags.ByCount }}
    <a class="chip" href="{{ .Page.RelPermalink }}"{{ if eq $.RelPermalink .Page.RelPermalink }} aria-current="page"{{ end }}>{{ .Page.LinkTitle | lower }}</a>
  {{- end }}
</nav>
