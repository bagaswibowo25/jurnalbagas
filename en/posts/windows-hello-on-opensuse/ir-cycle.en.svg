<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 522" width="360" height="522" role="img" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13"><title>The IR mode must be set again every time the camera opens</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker></defs><rect width="360" height="522" rx="8" fill="#FFFFFF"/><text x="24" y="30" font-size="15" font-weight="600" fill="#0A0A0A">The IR mode must be set again</text><text x="24" y="50" font-size="15" font-weight="600" fill="#0A0A0A">every time the camera opens</text><g fill="none" stroke="#666666" stroke-width="1.25" marker-end="url(#a)"><path d="M149 128V151"/><path d="M149 202V225"/><path d="M149 276V299"/><path d="M149 350V373"/><path d="M149 424V447"/><path d="M274 473H318V103H275"/></g><text x="332" y="288" font-size="11.5" fill="#555555" text-anchor="middle" transform="rotate(90 332 288)">next authentication</text><rect x="24" y="78" width="250" height="50" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="149" y="99" text-anchor="middle" font-weight="600" fill="#0A0A0A">Howdy opens the camera</text><text x="149" y="116" text-anchor="middle" font-size="11.5" fill="#555555">sudo, lock screen, login</text><rect x="24" y="152" width="250" height="50" rx="8" fill="#1E3A8A" fill-opacity="0.12" stroke="#1E3A8A" stroke-width="2"/><text x="149" y="173" text-anchor="middle" font-weight="600" fill="#0A0A0A">Patch: set mode 2</text><text x="149" y="190" text-anchor="middle" font-size="11.5" fill="#555555">before streaming starts</text><rect x="24" y="226" width="250" height="50" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="149" y="247" text-anchor="middle" font-weight="600" fill="#0A0A0A">Streaming, IR blinks</text><text x="149" y="264" text-anchor="middle" font-size="11.5" fill="#555555">bright and dark frames</text><rect x="24" y="300" width="250" height="50" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="149" y="321" text-anchor="middle" font-weight="600" fill="#0A0A0A">Face is matched</text><text x="149" y="338" text-anchor="middle" font-size="11.5" fill="#555555">dlib, 4-second limit</text><rect x="24" y="374" width="250" height="50" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="149" y="395" text-anchor="middle" font-weight="600" fill="#0A0A0A">Stream stops</text><text x="149" y="412" text-anchor="middle" font-size="11.5" fill="#555555">camera closed</text><rect x="24" y="448" width="250" height="50" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="149" y="469" text-anchor="middle" font-weight="600" fill="#0A0A0A">Camera resets to mode 1</text><text x="149" y="486" text-anchor="middle" font-size="11.5" fill="#555555">emitter off again</text></svg>
