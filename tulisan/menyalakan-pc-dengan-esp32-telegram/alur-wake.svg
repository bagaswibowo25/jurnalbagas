<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 548" width="360" height="548" role="img" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13"><title>Semua koneksi berawal dari dalam rumah, jadi CGNAT tidak masalah</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker></defs><rect width="360" height="548" rx="8" fill="#FFFFFF"/><text x="24" y="30" font-size="15" font-weight="600" fill="#0A0A0A">Semua koneksi berawal dari dalam</text><text x="24" y="50" font-size="15" font-weight="600" fill="#0A0A0A">rumah, jadi CGNAT tidak masalah</text><rect x="24" y="70" width="312" height="184" rx="8" fill="none" stroke="#D4D4D4"/><text x="40" y="92" font-size="11.5" fill="#555555">Internet</text><rect x="24" y="268" width="312" height="262" rx="8" fill="#F2F2F2" stroke="#D4D4D4"/><text x="40" y="500" font-size="11.5" fill="#555555">Jaringan rumah: router 4G di balik CGNAT,</text><text x="40" y="516" font-size="11.5" fill="#555555">tanpa port terbuka</text><g fill="none" stroke="#666666" stroke-width="1.25" marker-end="url(#a)"><path d="M160 150V188"/><path d="M160 330V240"/><path d="M160 378V426"/></g><text x="172" y="174" font-size="11.5" fill="#555555">/wake</text><text x="172" y="292" font-size="11.5" fill="#555555">long polling HTTPS,</text><text x="172" y="308" font-size="11.5" fill="#555555">koneksi keluar</text><text x="172" y="400" font-size="11.5" fill="#555555">magic packet UDP :9</text><text x="172" y="416" font-size="11.5" fill="#555555">lalu ping tiap 5 detik</text><rect x="40" y="102" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.25"/><text x="160" y="131" text-anchor="middle" font-weight="600" fill="#0A0A0A">HP pemilik (Telegram)</text><rect x="40" y="190" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.25"/><text x="160" y="219" text-anchor="middle" font-weight="600" fill="#0A0A0A">Server Telegram</text><rect x="40" y="330" width="240" height="48" rx="8" fill="#1E3A8A" fill-opacity="0.12" stroke="#1E3A8A" stroke-width="2"/><text x="160" y="359" text-anchor="middle" font-weight="600" fill="#0A0A0A">ESP32-C3 SuperMini</text><rect x="40" y="428" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.25"/><text x="160" y="457" text-anchor="middle" font-weight="600" fill="#0A0A0A">PC (CachyOS)</text></svg>
