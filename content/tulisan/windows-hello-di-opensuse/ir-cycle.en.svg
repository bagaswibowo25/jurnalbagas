<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13"><title>The IR mode must be set again every time the camera opens</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker></defs><rect width="760" height="300" rx="8" fill="#FFFFFF"/><text x="24" y="34" font-size="15" font-weight="600" fill="#0A0A0A">The IR mode must be set again every time the camera opens</text><g fill="none" stroke="#666666" stroke-width="1.25" marker-end="url(#a)"><path d="M230 110H280"/><path d="M480 110H530"/><path d="M630 138V208"/><path d="M530 236H480"/><path d="M280 236H230"/><path d="M130 208V138"/></g><rect x="30" y="82" width="200" height="56" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="130" y="106" text-anchor="middle" font-weight="600" fill="#0A0A0A">Howdy opens the camera</text><text x="130" y="124" text-anchor="middle" font-size="11.5" fill="#555555">sudo, lock screen, login</text><rect x="280" y="82" width="200" height="56" rx="8" fill="#1E3A8A" fill-opacity="0.12" stroke="#1E3A8A" stroke-width="2"/><text x="380" y="106" text-anchor="middle" font-weight="600" fill="#0A0A0A">Patch: set mode 2</text><text x="380" y="124" text-anchor="middle" font-size="11.5" fill="#555555">before streaming starts</text><rect x="530" y="82" width="200" height="56" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="630" y="106" text-anchor="middle" font-weight="600" fill="#0A0A0A">Streaming, IR blinks</text><text x="630" y="124" text-anchor="middle" font-size="11.5" fill="#555555">bright and dark frames</text><rect x="530" y="208" width="200" height="56" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="630" y="232" text-anchor="middle" font-weight="600" fill="#0A0A0A">Face is matched</text><text x="630" y="250" text-anchor="middle" font-size="11.5" fill="#555555">dlib, 4-second limit</text><rect x="280" y="208" width="200" height="56" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="380" y="232" text-anchor="middle" font-weight="600" fill="#0A0A0A">Stream stops</text><text x="380" y="250" text-anchor="middle" font-size="11.5" fill="#555555">camera closed</text><rect x="30" y="208" width="200" height="56" rx="8" fill="#FFFFFF" fill-opacity="1" stroke="#666666" stroke-width="1.25"/><text x="130" y="232" text-anchor="middle" font-weight="600" fill="#0A0A0A">Camera resets to mode 1</text><text x="130" y="250" text-anchor="middle" font-size="11.5" fill="#555555">emitter off again</text><text x="140" y="177" font-size="11.5" fill="#555555">next authentication</text></svg>
